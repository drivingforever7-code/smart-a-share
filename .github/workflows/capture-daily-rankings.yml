name: Capture daily ranking discoveries

on:
  schedule:
    # Beijing time 15:20, 16:20, 18:20 and next-day 06:20 backups.
    - cron: "20 7,8,10,22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: capture-daily-rankings
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out durable archive
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wake service and capture top-three rankings
        run: |
          curl \
            --fail \
            --show-error \
            --retry 8 \
            --retry-all-errors \
            --retry-delay 15 \
            --max-time 180 \
            --output /tmp/auto-backtest.json \
            "https://smart-a-share.onrender.com/api/auto-backtest?days=30"

      - name: Validate and archive the actual trading day
        run: |
          python scripts/archive_daily_rankings.py \
            /tmp/auto-backtest.json \
            --output-dir backend/ranking_archives

      - name: Commit archive when it is new
        run: |
          git config user.name "smart-a-share-bot"
          git config user.email "smart-a-share-bot@users.noreply.github.com"
          git add backend/ranking_archives
          if git diff --cached --quiet; then
            echo "The verified trading day is already archived."
            exit 0
          fi
          git commit -m "data: archive daily ranking snapshot"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Finalize daily limit-break outcomes
        run: |
          curl \
            --fail \
            --show-error \
            --retry 8 \
            --retry-all-errors \
            --retry-delay 15 \
            --max-time 180 \
            --request POST \
            "https://smart-a-share.onrender.com/api/limit-breaks/capture?stage=close"

      - name: Capture and evaluate streak/down-limit pools
        run: |
          curl \
            --fail \
            --show-error \
            --retry 8 \
            --retry-all-errors \
            --retry-delay 15 \
            --max-time 180 \
            --request POST \
            "https://smart-a-share.onrender.com/api/board-pools/capture"